<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview – StepCrumbs</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="base.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .bar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .bar b { margin-right: auto; }
    .bar select { width: auto; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 600; }
    .seg button.on { background: var(--text); color: var(--bg); }
    iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    .loading { padding: 40px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <b id="ttl">Preview</b>
    <div class="seg" role="tablist"><button data-t="guide">Guide</button><button data-t="sop">SOP</button></div>
    <select id="paper" aria-label="Paper size"><option value="Letter">Letter</option><option value="A4">A4</option></select>
    <span class="muted" style="font-size:12.5px">In the print dialog pick <b>Save as PDF</b> and turn on <b>Background graphics</b>.</span>
    <button id="print" class="btn primary" disabled>Save as PDF / Print</button>
  </div>
  <div id="loading" class="loading">Rendering…</div>
  <iframe id="frame" title="Preview" class="hidden"></iframe>
  <script type="module" src="preview.js"></script>
</body>
</html>
